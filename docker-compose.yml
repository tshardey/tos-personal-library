services:
  app:
    build: .
    working_dir: /app
    environment:
      TOS_REPO_DIR: /tos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${TOS_REPO_PATH:-../tome-of-secrets}:/tos
      - /var/run/docker.sock:/var/run/docker.sock

  # Playwright walkthrough (Task 9) against the LOCAL Supabase stack on the host:
  #   E2E_SUPABASE_PUBLISHABLE_KEY=<local key> docker compose run --rm e2e npx playwright test
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app
    ipc: host
    environment:
      E2E_SUPABASE_URL: ${E2E_SUPABASE_URL:-http://host.docker.internal:54321}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${E2E_SUPABASE_PUBLISHABLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
